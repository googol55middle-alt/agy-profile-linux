[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-profile-linux"
version = "0.1.0"
description = "Hardened Linux account switcher for Antigravity CLI"
requires-python = ">=3.10"
readme = "README.md"
authors = [
  { name = "agy-profile-linux contributors" }
]
license = { file = "LICENSE" }
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://googol55middle-alt.github.io/agy-profile-linux/"
Repository = "https://github.com/googol55middle-alt/agy-profile-linux"
Issues = "https://github.com/googol55middle-alt/agy-profile-linux/issues"

[project.scripts]
agy-profile-linux = "agy_profile_linux.cli:main"
agy-profile = "agy_profile_linux.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
