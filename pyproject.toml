[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-profile-linux"
version = "0.1.0"
description = "Hardened Linux account switcher for Antigravity CLI"
requires-python = ">=3.10"
readme = "README.md"
authors = [
  { name = "agy-profile-linux contributors" }
]
dependencies = []

[project.scripts]
agy-profile-linux = "agy_profile_linux.cli:main"
agy-profile = "agy_profile_linux.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
