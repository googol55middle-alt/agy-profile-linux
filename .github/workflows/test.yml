name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools
      - name: Compile source and tests
        run: python -m py_compile src/agy_profile_linux/*.py tests/test_manager_hardening.py
      - name: Run hardening tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_manager_hardening.py' -v
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/agy-profile-linux-wheel-venv
          /tmp/agy-profile-linux-wheel-venv/bin/python -m pip install --no-index --find-links=dist agy-profile-linux==0.1.0
      - name: Smoke-test installed entry points
        run: |
          /tmp/agy-profile-linux-wheel-venv/bin/agy-profile-linux --help
          /tmp/agy-profile-linux-wheel-venv/bin/agy-profile --help

  recover-stale-pages-deployment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Cancel the stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_PAGES_SHA: 73529f3f000cefaeef640cefd6da3a892bb2be3f
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          stale_sha = os.environ["STALE_PAGES_SHA"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "agy-profile-linux-pages-recovery",
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/pages/deployments?per_page=100",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              deployments = json.load(response)
          cancelled = 0
          for deployment in deployments:
              if deployment.get("sha") != stale_sha:
                  continue
              if deployment.get("status") not in {"queued", "in_progress", "pending"}:
                  continue
              deployment_id = deployment["id"]
              cancel_request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/pages/deployments/{deployment_id}/cancel",
                  data=b"{}",
                  headers={**headers, "Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(cancel_request, timeout=30) as response:
                  if response.status not in {200, 202}:
                      raise RuntimeError(f"unexpected cancellation status: {response.status}")
              cancelled += 1
          print(f"cancelled_stale_pages_deployments={cancelled}")
          PY
