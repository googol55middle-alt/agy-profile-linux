name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --upgrade pip setuptools
      - name: Compile source and tests
        run: python -m py_compile src/agy_profile_linux/*.py tests/test_manager_hardening.py
      - name: Run hardening tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_manager_hardening.py' -v
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
